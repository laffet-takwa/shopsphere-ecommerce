spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: shopsphere/notification-service:1.0.0
          ports: [{ containerPort: 8086 }]
          envFrom:
            - configMapRef: { name: shopsphere-config }
          env:
            - { name: SERVER_PORT, value: "8086" }
            - { name: MONGODB_URI, value: mongodb://mongodb:27017/shopsphere_notifications }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8086 }, initialDelaySeconds: 35, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 768Mi } }
