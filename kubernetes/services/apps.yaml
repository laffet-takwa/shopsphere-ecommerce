apiVersion: apps/v1
kind: Deployment
metadata: { name: shopsphere-web, namespace: shopsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: shopsphere-web } }
  template:
    metadata: { labels: { app: shopsphere-web } }
    spec:
      containers:
        - name: shopsphere-web
          image: shopsphere/web:1.0.0
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: shopsphere-web, namespace: shopsphere }
spec:
  selector: { app: shopsphere-web }
  ports: [{ name: http, port: 80, targetPort: 80 }]