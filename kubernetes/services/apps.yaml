apiVersion: apps/v1
kind: Deployment
metadata: { name: discovery-server, namespace: shopsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: discovery-server } }
  template:
    metadata: { labels: { app: discovery-server } }
    spec:
      containers:
        - name: discovery-server
          image: shopsphere/discovery-server:1.0.0
          ports: [{ containerPort: 8761 }]
          env: [{ name: SERVER_PORT, value: "8761" }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8761 }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: discovery-server, namespace: shopsphere }
spec:
  selector: { app: discovery-server }
  ports: [{ name: http, port: 8761, targetPort: 8761 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: shopsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: shopsphere/api-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: shopsphere-config }
            - secretRef: { name: jwt-secret }
          env: [{ name: SERVER_PORT, value: "8080" }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: shopsphere }
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: shopsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: shopsphere/auth-service:1.0.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: shopsphere-config }
            - secretRef: { name: postgres-secret }
            - secretRef: { name: jwt-secret }
            - secretRef: { name: auth-bootstrap-secret }
          env: [{ name: SERVER_PORT, value: "8081" }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 35, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: shopsphere }
spec:
  selector: { app: auth-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
