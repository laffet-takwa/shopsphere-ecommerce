apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shopsphere
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: shopsphere
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@kafka:9093 }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 2, memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Creates the six event topics once, with an explicit partition count, instead of relying on
# broker auto-creation. Jobs are immutable, so a redeploy that needs changed partitions should
# delete this job rather than editing it in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: shopsphere
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.1
          env:
            - { name: KAFKA_BOOTSTRAP, value: kafka:9092 }
            - { name: KAFKA_TOPIC_PARTITIONS, value: "3" }
            - { name: KAFKA_REPLICATION_FACTOR, value: "1" }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for topic in order.created inventory.reserved inventory.insufficient \
                          payment.completed payment.failed order.shipped; do
                if kafka-topics.sh --bootstrap-server "${KAFKA_BOOTSTRAP}" --list 2>/dev/null | grep -qx "${topic}"; then
                  echo "Topic ${topic} already exists, leaving it unchanged."
                  continue
                fi
                kafka-topics.sh --bootstrap-server "${KAFKA_BOOTSTRAP}" \
                  --create --topic "${topic}" \
                  --partitions "${KAFKA_TOPIC_PARTITIONS}" \
                  --replication-factor "${KAFKA_REPLICATION_FACTOR}" \
                  --config cleanup.policy=delete \
                  --config retention.ms=604800000
                echo "Created ${topic}."
              done
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }