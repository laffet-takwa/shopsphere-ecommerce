apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopsphere
  namespace: shopsphere
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: shopsphere.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopsphere-web
                port:
                  number: 80