apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shopsphere
type: Opaque
stringData:
  POSTGRES_USER: shopsphere
  POSTGRES_PASSWORD: replace-before-deploy
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: shopsphere
type: Opaque
stringData:
  JWT_SECRET: replace-with-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-bootstrap-secret
  namespace: shopsphere
type: Opaque
stringData:
  SHOPSPHERE_ADMIN_EMAIL: admin@example.invalid
  SHOPSPHERE_ADMIN_PASSWORD: replace-with-a-long-random-password