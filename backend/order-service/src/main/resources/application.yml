server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/shopsphere_orders}
    username: ${POSTGRES_USER:shopsphere}
    password: ${POSTGRES_PASSWORD:shopsphere_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    loadbalancer:
      retry:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Emit plain JSON with no Java class name in the headers. Consumers map the payload into
      # their own event record, so the wire never carries a type to be trusted or resolved.
      spring.json.add.type.headers: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}