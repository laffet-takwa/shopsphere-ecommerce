server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: shopsphere-demo
  # One database for the hosted demo instead of database-per-service. The repositories keep the
  # real per-service split; see docs/deployment-hosting.md for the trade-off.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsphere_demo}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere_dev}
    hikari:
      # Free host databases close idle connections aggressively; keeping the pool small and short
      # lived avoids stale-connection errors on the first request after a cold start.
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 0
      connection-timeout: 20000
      max-lifetime: 240000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # data.sql would otherwise run before Hibernate creates the tables on a fresh database.
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      # Idempotent seed: re-runs on restart without duplicating catalogue rows.
      mode: ${SEED_MODE:always}
      continue-on-error: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/shopsphere_demo}
      auto-index-creation: true
  cloud:
    # order-service calls http://product-service through @LoadBalanced. In the real topology Eureka
    # resolves that name; here the single instance is itself, so discovery stays configured but
    # serverless.
    discovery:
      client:
        simple:
          instances:
            product-service:
              - uri: http://localhost:${SERVER_PORT:8080}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    # Off by default so the demo boots with no broker. Set KAFKA_ENABLED=true together with
    # KAFKA_BOOTSTRAP_SERVERS to enable the full event-driven order flow.
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
    admin:
      fail-fast: false

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1tdXN0LWJlLWNoYW5nZWQtMzItYnl0ZXM=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  bootstrap-admin:
    email: ${SHOPSPHERE_ADMIN_EMAIL:}
    password: ${SHOPSPHERE_ADMIN_PASSWORD:}
  payment:
    decline-above-amount: ${PAYMENT_DECLINE_ABOVE_AMOUNT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.shopsphere: INFO
    org.apache.kafka: WARN
