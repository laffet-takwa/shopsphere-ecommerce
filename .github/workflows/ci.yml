name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify ${{ matrix.service }}
        run: mvn -B -f backend/${{ matrix.service }}/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shopsphere-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/shopsphere-web/package-lock.json
      - run: npm ci
      - run: npm run build