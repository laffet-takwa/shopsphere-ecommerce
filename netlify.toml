[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite bakes VITE_API_URL in at build time, so this must match the deployed API origin.
# Set it in the Netlify UI (Site settings -> Environment variables) or with `netlify env:set`.
[context.production.environment]
  NODE_ENV = "production"

# Single-page app: every unknown path is handled by vue-router, not the CDN.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    Cache-Control = "public, max-age=31536000, immutable"